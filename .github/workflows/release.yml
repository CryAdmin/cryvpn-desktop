name: Сборка

# Установщик собирается здесь, из открытого кода, а не на чьём-то компьютере.
# Так любой может убедиться, что файл в релизе получен именно из этого
# репозитория. На метку вида v0.1.0 сборка публикуется в Releases.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Ядро и драйвер (со сверкой контрольных сумм)
        shell: pwsh
        run: ./scripts/resources.ps1

      - name: Зависимости
        run: npm ci

      - name: Проверки
        working-directory: src-tauri
        run: cargo test --lib

      - name: Сборка установщика
        run: npm run tauri build

      - name: Имя и контрольная сумма
        id: out
        shell: pwsh
        run: |
          $src = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item $src.FullName out/CryVPN-Setup.exe
          $sha = (Get-FileHash -Algorithm SHA256 out/CryVPN-Setup.exe).Hash.ToLower()
          "$sha  CryVPN-Setup.exe" | Out-File -Encoding ascii out/CryVPN-Setup.exe.sha256
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          @{ version = $ver; commit = "${{ github.sha }}".Substring(0,7); sha256 = $sha;
             size = (Get-Item out/CryVPN-Setup.exe).Length; file = "CryVPN-Setup.exe" } |
            ConvertTo-Json | Out-File -Encoding utf8 out/version.json
          Get-Content out/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: CryVPN-Windows
          path: out/


  linux:
    # Собираем на старой Ubuntu намеренно: пакет, собранный на свежей
    # системе, не запустится на более старых из-за версии системной
    # библиотеки, а наоборот — запустится.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Системные библиотеки
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev patchelf file

      - name: Ядро (со сверкой контрольной суммы)
        run: ./scripts/resources-linux.sh

      - name: Зависимости
        run: npm ci

      - name: Проверки
        working-directory: src-tauri
        run: cargo test --lib

      - name: Сборка пакетов
        run: npm run tauri build

      - name: Имена и контрольные суммы
        run: |
          mkdir -p out
          b=src-tauri/target/release/bundle
          cp "$(ls $b/appimage/*.AppImage | head -1)" out/CryVPN-Linux.AppImage
          cp "$(ls $b/deb/*.deb | head -1)" out/CryVPN-Linux.deb
          cp "$(ls $b/rpm/*.rpm | head -1)" out/CryVPN-Linux.rpm
          chmod +x out/CryVPN-Linux.AppImage
          cd out
          for f in CryVPN-Linux.AppImage CryVPN-Linux.deb CryVPN-Linux.rpm; do
            sha256sum "$f" > "$f.sha256"
            cat "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: CryVPN-Linux
          path: out/


  android:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Ядро (со сверкой контрольной суммы)
        run: ./scripts/resources-android.sh

      - name: Зависимости
        run: npm ci

      # Ключ подписи хранится в секретах репозитория и в код не попадает.
      # Без него (например, в запросе на слияние из чужой копии) APK
      # собирается неподписанным — проверить сборку можно, установить нельзя.
      - name: Ключ подписи
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            printf 'storeFile=%s\nkeyAlias=cryvpn\npassword=%s\n' "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" > src-tauri/gen/android/keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Ключа нет — сборка без подписи"
          fi

      - name: Сборка APK
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm run tauri android build -- --apk --target aarch64

      - name: Имя и контрольная сумма
        run: |
          mkdir -p out
          cp "$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)" out/CryVPN-Android.apk
          (cd out && sha256sum CryVPN-Android.apk > CryVPN-Android.apk.sha256 && cat CryVPN-Android.apk.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: CryVPN-Android
          path: out/

  # Выпуск публикуется один раз и целиком, когда собраны все три системы.
  #
  # Раньше каждое задание выкладывало свои файлы само, как только
  # заканчивало. Linux и Android собираются быстрее Windows, выпуск
  # появлялся без установщика Windows, и ссылка «последняя версия» на
  # CryVPN-Setup.exe минут десять отдавала 404 — на странице подписки, в
  # боте и в канале. 14.11.2026 это заметили на 0.1.24. Теперь выпуск
  # сначала собирается черновиком, а открывается одним движением, уже со
  # всеми файлами. Не хватает хоть одного — не публикуем вовсе.
  release:
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Все ли файлы на месте
        env:
          SIGNED: ${{ needs.android.outputs.signed }}
        run: |
          cd out
          ls -la
          for f in CryVPN-Setup.exe CryVPN-Setup.exe.sha256 version.json \
                   CryVPN-Android.apk CryVPN-Android.apk.sha256 \
                   CryVPN-Linux.AppImage CryVPN-Linux.AppImage.sha256 \
                   CryVPN-Linux.deb CryVPN-Linux.deb.sha256 \
                   CryVPN-Linux.rpm CryVPN-Linux.rpm.sha256; do
            [ -s "$f" ] || { echo "Нет файла $f — выпуск не публикуем"; exit 1; }
          done
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ] && [ "$SIGNED" != "true" ]; then
            echo "APK не подписан — выпуск не публикуем"; exit 1
          fi

      - name: Публикация в Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --title "$TAG" --notes-file .github/release-notes.md out/*
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json assets -q '.assets[].name'
