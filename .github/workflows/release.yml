name: Сборка

# Установщик собирается здесь, из открытого кода, а не на чьём-то компьютере.
# Так любой может убедиться, что файл в релизе получен именно из этого
# репозитория. На метку вида v0.1.0 сборка публикуется в Releases.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Ядро и драйвер (со сверкой контрольных сумм)
        shell: pwsh
        run: ./scripts/resources.ps1

      - name: Зависимости
        run: npm ci

      - name: Проверки
        working-directory: src-tauri
        run: cargo test --lib

      - name: Сборка установщика
        run: npm run tauri build

      - name: Имя и контрольная сумма
        id: out
        shell: pwsh
        run: |
          $src = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item $src.FullName out/CryVPN-Setup.exe
          $sha = (Get-FileHash -Algorithm SHA256 out/CryVPN-Setup.exe).Hash.ToLower()
          "$sha  CryVPN-Setup.exe" | Out-File -Encoding ascii out/CryVPN-Setup.exe.sha256
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          @{ version = $ver; commit = "${{ github.sha }}".Substring(0,7); sha256 = $sha;
             size = (Get-Item out/CryVPN-Setup.exe).Length; file = "CryVPN-Setup.exe" } |
            ConvertTo-Json | Out-File -Encoding utf8 out/version.json
          Get-Content out/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: CryVPN-Windows
          path: out/

      - name: Публикация в Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # На странице выпуска обязаны быть правила подписи — это условие
          # SignPath Foundation. Текст общий для всех выпусков.
          body_path: .github/release-notes.md
          files: |
            out/CryVPN-Setup.exe
            out/CryVPN-Setup.exe.sha256
            out/version.json

  linux:
    # Собираем на старой Ubuntu намеренно: пакет, собранный на свежей
    # системе, не запустится на более старых из-за версии системной
    # библиотеки, а наоборот — запустится.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Системные библиотеки
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev patchelf file

      - name: Ядро (со сверкой контрольной суммы)
        run: ./scripts/resources-linux.sh

      - name: Зависимости
        run: npm ci

      - name: Проверки
        working-directory: src-tauri
        run: cargo test --lib

      - name: Сборка пакетов
        run: npm run tauri build

      - name: Имена и контрольные суммы
        run: |
          mkdir -p out
          b=src-tauri/target/release/bundle
          cp "$(ls $b/appimage/*.AppImage | head -1)" out/CryVPN-Linux.AppImage
          cp "$(ls $b/deb/*.deb | head -1)" out/CryVPN-Linux.deb
          cp "$(ls $b/rpm/*.rpm | head -1)" out/CryVPN-Linux.rpm
          chmod +x out/CryVPN-Linux.AppImage
          cd out
          for f in CryVPN-Linux.AppImage CryVPN-Linux.deb CryVPN-Linux.rpm; do
            sha256sum "$f" > "$f.sha256"
            cat "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: CryVPN-Linux
          path: out/

      - name: Публикация в Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes.md
          files: |
            out/CryVPN-Linux.AppImage
            out/CryVPN-Linux.AppImage.sha256
            out/CryVPN-Linux.deb
            out/CryVPN-Linux.deb.sha256
            out/CryVPN-Linux.rpm
            out/CryVPN-Linux.rpm.sha256

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Ядро (со сверкой контрольной суммы)
        run: ./scripts/resources-android.sh

      - name: Зависимости
        run: npm ci

      # Ключ подписи хранится в секретах репозитория и в код не попадает.
      # Без него (например, в запросе на слияние из чужой копии) APK
      # собирается неподписанным — проверить сборку можно, установить нельзя.
      - name: Ключ подписи
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            printf 'storeFile=%s\nkeyAlias=cryvpn\npassword=%s\n' "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" > src-tauri/gen/android/keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Ключа нет — сборка без подписи"
          fi

      - name: Сборка APK
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm run tauri android build -- --apk --target aarch64

      - name: Имя и контрольная сумма
        run: |
          mkdir -p out
          cp "$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)" out/CryVPN-Android.apk
          (cd out && sha256sum CryVPN-Android.apk > CryVPN-Android.apk.sha256 && cat CryVPN-Android.apk.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: CryVPN-Android
          path: out/

      # Неподписанный APK в выпуск не идёт: установить его нельзя.
      - name: Публикация в Releases
        if: startsWith(github.ref, 'refs/tags/v') && steps.key.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes.md
          files: |
            out/CryVPN-Android.apk
            out/CryVPN-Android.apk.sha256
