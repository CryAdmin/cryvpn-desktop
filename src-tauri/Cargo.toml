[package]
name = "cryvpn"
version = "0.1.16"
description = "CryVPN desktop client"
authors = ["CryVPN"]
license = "GPL-3.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cryvpn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon — значок возле часов: приложение сворачивается туда, а VPN
# продолжает работать.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Ссылки cryvpn:// со страницы подписки и запрет второго экземпляра:
# вторая копия передаёт ссылку первой и закрывается.
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Запросы к кабинету идём делать отсюда, а не из окна: у окна чужой источник,
# и сервер его не пустит. cookies обязателен — на куке держится продление входа.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "cookies",
  "rustls-tls",
] }
# Сверка скачанного обновления с его описанием.
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time", "net", "rt", "rt-multi-thread", "macros", "io-util"] }


[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Окно выбора файла — программа, которую человек пускает мимо VPN.
tauri-plugin-dialog = "2"

# Android: передача туннеля дочернему процессу.
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
